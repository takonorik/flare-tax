name: Check Windows start

# start.bat が Windows で動くかの確認 (手動で実行する)。
# 日本語 Windows と同じ文字コード (932) にしてから start.bat を起動し、画面と計算用のファイルが取れることを確かめる。

on:
  workflow_dispatch:

permissions: {}

jobs:
  start-bat:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Run start.bat and fetch files
        shell: pwsh
        run: |
          $p = Start-Process cmd -ArgumentList '/c', 'chcp 932 >nul & start.bat' -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 8
          $ok = $true
          foreach ($u in 'index.html', 'web/worker.js', 'web/httpx.py', 'flare_tax/__init__.py', 'flare_tax/service.py') {
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:5500/$u" -UseBasicParsing
              "$u -> $($r.StatusCode) ($($r.RawContentLength) bytes)"
              if ($r.StatusCode -ne 200) { $ok = $false }
            } catch { "$u -> FAILED: $_"; $ok = $false }
          }
          "--- stdout"; Get-Content out.txt -Encoding UTF8
          "--- stderr"; Get-Content err.txt -Encoding UTF8
          taskkill /F /IM python.exe 2>$null | Out-Null
          $err = (Get-Content err.txt -Raw)
          if ($err -match 'is not recognized') { "start.bat の行が正しく読めていません"; $ok = $false }
          if (-not $ok) { exit 1 }
