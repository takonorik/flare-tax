name: Deploy

# main に push されたら GitHub Pages に公開する。Actions タブの「Run workflow」でも公開し直せる。
#
# 限定公開（簡易的な鍵）は、コードを変えずに GitHub の設定だけで切り替える:
#   Settings → Secrets and variables → Actions
#     Secrets   ACCESS_CODE = アクセスコード
#     Variables ACCESS_GATE = on / off

on:
  push:
    branches: [main]
  workflow_dispatch:

# 権限はジョブごとに必要な分だけ与える
permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write           # GitHub Pages への公開に必要
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # ランナー標準の python3 を使う（標準ライブラリだけで動く）
      - name: Build site
        env:
          ACCESS_GATE: ${{ vars.ACCESS_GATE }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: python3 scripts/build_site.py _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
